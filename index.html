<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jon Malmaud</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>jm</text></svg>">
<style>
:root {
  --bg: #fdfdfc;
  --fg: #1a1a18;
  --muted: #6b6b66;
  --rule: #e2e2dd;
  --accent: #0b5fa5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14140f;
    --fg: #ecece6;
    --muted: #9a9a92;
    --rule: #2e2e28;
    --accent: #7fb2e5;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 48px 16px;
}
main { width: 100%; max-width: 32rem; }
h1 {
  margin: 0 0 1.5rem;
  font-size: 1.75rem;
  font-weight: 600;
  letter-spacing: -0.015em;
}
ul {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--rule);
}
li { border-bottom: 1px solid var(--rule); }
a {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 0.75rem;
  padding: 0.85rem 0;
  color: inherit;
  text-decoration: none;
}
a:hover .label, a:focus-visible .label {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.label { font-weight: 500; }
.detail {
  color: var(--muted);
  font-size: 0.875rem;
  margin-left: auto;
  word-break: break-word;
}
</style>
</head>
<body>
<main>
  <h1>Jon Malmaud</h1>
  <ul>
    <li>
      <a href="https://github.com/malmaud">
        <span class="label">GitHub</span>
        <span class="detail">@malmaud</span>
      </a>
    </li>
    <li>
      <a href="mailto:malmaud@gmail.com">
        <span class="label">Email</span>
        <span class="detail">malmaud@gmail.com</span>
      </a>
    </li>
    <li>
      <a href="https://github.com/malmaud/TensorFlow.jl">
        <span class="label">TensorFlow.jl</span>
        <span class="detail">source</span>
      </a>
    </li>
    <li>
      <a href="/tfdocs/">
        <span class="label">TensorFlow.jl documentation</span>
        <span class="detail">tfdocs</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
