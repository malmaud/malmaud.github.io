<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonathan Malmaud</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>jm</text></svg>">
<style>
:root {
  --bg: #fdfdfc;
  --fg: #1a1a18;
  --rule: #e2e2dd;
  --accent: #0b5fa5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14140f;
    --fg: #ecece6;
    --rule: #2e2e28;
    --accent: #7fb2e5;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 48px 16px;
}
main { width: 100%; max-width: 32rem; }
h1 {
  margin: 0 0 1.5rem;
  font-size: 1.75rem;
  font-weight: 600;
  letter-spacing: -0.015em;
}
ul {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--rule);
}
li { border-bottom: 1px solid var(--rule); }
a {
  display: block;
  padding: 0.85rem 0;
  color: inherit;
  text-decoration: none;
  font-weight: 500;
}
a:hover, a:focus-visible {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Jonathan Malmaud</h1>
  <ul>
    <li><a href="https://github.com/malmaud">GitHub</a></li>
    <li><a href="https://github.com/malmaud/TensorFlow.jl">TensorFlow.jl</a></li>
    <li><a href="https://www.linkedin.com/in/jonathan-malmaud-030b6b180/">LinkedIn</a></li>
  </ul>
</main>
</body>
</html>
